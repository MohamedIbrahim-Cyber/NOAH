# ==============================================================================
# Supervisor Configuration for Laravel Queue Worker
# Location: /etc/supervisor/conf.d/nohe-worker.conf
# ==============================================================================

[program:nohe-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/nohe-api/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/nohe-api/storage/logs/worker.log
stopwaitsecs=3600
