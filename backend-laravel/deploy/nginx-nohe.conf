# ==============================================================================
# Nginx Virtual Host for Laravel 11 API Backend
# Location: /etc/nginx/sites-available/nohe-api
# Domain: api.noheacademy.sa
# ==============================================================================

# Rate limiting zone for API requests
limit_req_zone $binary_remote_addr zone=nohe_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nohe_login_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.noheacademy.sa;

    root /var/www/nohe-api/public;
    index index.php index.html;

    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        limit_req zone=nohe_api_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Stricter rate limit on login endpoint
    location /api/login {
        limit_req zone=nohe_login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
