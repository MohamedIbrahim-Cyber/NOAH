[phases.setup]
nixPkgs = ["php83", "php83Packages.composer"]

[phases.build]
cmds = [
    "mkdir -p bootstrap/cache storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs",
    "chmod -R 777 bootstrap/cache storage 2>/dev/null || chmod -R 775 bootstrap/cache storage",
    "composer install --no-dev --optimize-autoloader --no-interaction"
]

[start]
cmd = "mkdir -p bootstrap/cache storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs && (chmod -R 777 bootstrap/cache storage 2>/dev/null || chmod -R 775 bootstrap/cache storage) && php artisan serve --host=0.0.0.0 --port=$PORT"
